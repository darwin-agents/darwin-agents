# Helm chart CI — `helm lint` + `helm template` over multiple value
# fixtures so chart breakage is caught in PRs instead of at install time.
#
# Renders against:
#   - default values.yaml (dev-shape: auth off, ingress off, single
#     replica with persistence PVC).
#   - tests/values-prod.yaml (production-shape: auth on with
#     existingSecret reference, ingress + TLS + ServiceMonitor +
#     tracing + tight egress NetworkPolicy).

name: helm

on:
  push:
    branches: [main, "release/**"]
    paths:
      - "infra/charts/**"
      - ".github/workflows/helm.yml"
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "infra/charts/**"
      - ".github/workflows/helm.yml"
  workflow_dispatch: {}

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: helm lint + template
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: helm lint
        run: helm lint infra/charts/darwin-platform

      - name: helm template (default values)
        run: |
          helm template darwin infra/charts/darwin-platform > /tmp/default.yaml
          # Sanity: every default install renders at least Deployment +
          # Service + PVC + ServiceAccount.
          for kind in Deployment Service PersistentVolumeClaim ServiceAccount NetworkPolicy; do
            grep -q "^kind: ${kind}$" /tmp/default.yaml \
              || { echo "missing ${kind} in default render"; exit 1; }
          done

      - name: helm template (production values fixture)
        run: |
          helm template darwin infra/charts/darwin-platform \
            -f infra/charts/darwin-platform/tests/values-prod.yaml \
            > /tmp/prod.yaml
          # Production fixture exercises every optional template. Note:
          # the Secret is NOT rendered when auth.existingSecret is set
          # (the operator manages the Secret out-of-band) — Ingress +
          # ServiceMonitor + NetworkPolicy are the prod-specific kinds.
          for kind in Deployment Service PersistentVolumeClaim ServiceAccount NetworkPolicy Ingress ServiceMonitor; do
            grep -q "^kind: ${kind}$" /tmp/prod.yaml \
              || { echo "missing ${kind} in prod render"; exit 1; }
          done

      - name: helm template (inline-secret values)
        run: |
          # Exercise the Secret-rendering path with auth.enabled=true and
          # no existingSecret — the chart should produce a Secret with
          # tokens.json stringData.
          helm template darwin infra/charts/darwin-platform \
            --set auth.enabled=true \
            --set 'auth.tokens[0].token=alice' \
            --set 'auth.tokens[0].scopes[0]=owner' \
            > /tmp/inline.yaml
          grep -q "^kind: Secret$" /tmp/inline.yaml \
            || { echo "missing Secret when auth.tokens is set"; exit 1; }
          grep -q "tokens.json:" /tmp/inline.yaml \
            || { echo "Secret missing tokens.json key"; exit 1; }

      - name: helm template (PodDisruptionBudget)
        run: |
          helm template darwin infra/charts/darwin-platform \
            --set replicaCount=2 \
            --set leaderElection.enabled=true \
            --set database.url=postgresql://darwin:darwin@postgres:5432/darwin \
            --set podDisruptionBudget.enabled=true \
            > /tmp/pdb.yaml
          grep -q "^kind: PodDisruptionBudget$" /tmp/pdb.yaml \
            || { echo "missing PodDisruptionBudget when podDisruptionBudget.enabled=true"; exit 1; }

      - name: helm template (postgres mode)
        run: |
          # Exercise the Postgres-mode rendering: PVC is omitted, the
          # Deployment env carries DATABASE_URL, the Deployment args
          # use --db=$(DATABASE_URL). Both URL forms (inline + Secret).
          helm template darwin infra/charts/darwin-platform \
            --set database.url='postgresql://darwin:test@pg:5432/darwin' \
            > /tmp/pg.yaml
          grep -q "^kind: PersistentVolumeClaim$" /tmp/pg.yaml \
            && { echo "Postgres mode should not render PVC"; exit 1; } || true
          grep -q "DATABASE_URL" /tmp/pg.yaml \
            || { echo "Postgres mode missing DATABASE_URL env"; exit 1; }
          # existingSecret path: env value should reference the Secret.
          helm template darwin infra/charts/darwin-platform \
            --set database.existingSecret=darwin-db-url \
            > /tmp/pgsec.yaml
          grep -q "secretKeyRef:" /tmp/pgsec.yaml \
            || { echo "existingSecret should use secretKeyRef"; exit 1; }

      - name: helm template (provider integrations — sinks + sanctions)
        run: |
          # Inline values render a providers Secret + the corresponding
          # env vars on the Deployment.
          helm template darwin infra/charts/darwin-platform \
            --set 'providers.sanctions.provider=chainalysis' \
            --set 'providers.sanctions.apiKey=test-key' \
            --set 'providers.notifications.slackWebhookUrl=https://hook.example/x' \
            --set 'providers.notifications.pagerdutyRoutingKey=rk' \
            --set 'providers.fiat.stripeApiKey=sk_test' \
            > /tmp/providers.yaml
          # A providers Secret is rendered.
          # fullname = <release>-<chart> = darwin-darwin-platform
          grep -q "name: darwin-darwin-platform-providers$" /tmp/providers.yaml \
            || { echo "providers Secret missing"; exit 1; }
          # Env vars wired on the Deployment.
          for env in DARWIN_SANCTIONS_API_KEY DARWIN_SLACK_WEBHOOK_URL \
                     DARWIN_PAGERDUTY_ROUTING_KEY STRIPE_API_KEY; do
            grep -q "name: ${env}" /tmp/providers.yaml \
              || { echo "missing env ${env}"; exit 1; }
          done

      - name: helm template (provider existingSecret path)
        run: |
          # When existingSecret is set, no providers Secret should be
          # rendered, but env vars should still be wired via
          # secretKeyRef pointing at the referenced Secret.
          helm template darwin infra/charts/darwin-platform \
            --set 'providers.notifications.existingSecret=my-notif-secret' \
            > /tmp/providers-ext.yaml
          grep -q "DARWIN_SLACK_WEBHOOK_URL" /tmp/providers-ext.yaml \
            || { echo "external Secret should still wire env"; exit 1; }
          grep -q "name: my-notif-secret" /tmp/providers-ext.yaml \
            || { echo "missing reference to existingSecret"; exit 1; }
