# Build + push the supervisor container image.
#
# Triggers:
#   - push to main           → publishes ghcr.io/{repo}:latest + sha-XXXXXX
#   - tag v*.*.*             → publishes the semver tag too
#   - workflow_dispatch      → manual trigger from the Actions UI
#
# Registry: GHCR (free for public repos, signed-in pull for private).
# Multi-arch (amd64 + arm64) via buildx so deployers on Apple Silicon
# clusters or AWS Graviton can pull the same image.

name: build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # ghcr needs both. id-token for cosign (future signing step).
  contents: read
  packages: write
  id-token: write

jobs:
  image:
    name: docker build + push
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Image name = ghcr.io/<owner>/<repo>/darwin-platform.
          # docker/metadata-action lowercases the repo name for us.
          images: ghcr.io/${{ github.repository }}/darwin-platform
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=darwin-platform
            org.opencontainers.image.description=Darwin platform supervisor (docs/engineering/08)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=PROPRIETARY

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
