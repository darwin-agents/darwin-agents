# Web dashboard (Next.js 15) — lint / typecheck / test / build.
# Triggers on changes under web/** and on the workflow file itself.

name: web

on:
  push:
    branches: [main, "release/**"]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch: {}

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  build:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: pnpm build

  e2e:
    name: playwright (dev-token)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run after the build job to avoid burning E2E minutes on a PR that
    # already failed lint/typecheck/unit. Defers to retries (2) on flake.
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (dev-token project)
        env:
          # Force the dev-token auth path even if Clerk env is present in
          # repo secrets — the dev-token project's webServer relies on this.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ""
        run: pnpm exec playwright test --project=dev-token

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7
