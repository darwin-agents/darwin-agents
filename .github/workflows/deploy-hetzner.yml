# Deploy the Darwin platform to Hetzner Cloud (k3s) via Terraform.
#
# Triggers:
#   - release published      → deploy the release tag's image
#   - workflow_dispatch      → deploy any image tag (plan-only unless
#                              auto_approve is checked)
#
# Deploys the GHCR image already built by build.yml
# (ghcr.io/<owner>/<repo>/darwin-platform), pinned by tag, by running
# `terraform apply` over infra/terraform/envs/hetzner.
#
# ── Required GitHub config (scope to the `hetzner-prod` Environment) ──────────
# Secrets:
#   HCLOUD_TOKEN              Hetzner Cloud API token (Read+Write)
#   TF_SSH_PUBLIC_KEY         public SSH key authorized on the nodes
#   TF_SSH_PRIVATE_KEY        matching private key (kubeconfig fetch)
#   HETZNER_S3_ACCESS_KEY     Hetzner Object Storage S3 access key (state)
#   HETZNER_S3_SECRET_KEY     Hetzner Object Storage S3 secret key (state)
#   LITELLM_MASTER_KEY        (optional) LiteLLM proxy admin key
# Variables:
#   DARWIN_DOMAIN            api host, e.g. api.darwinagents.com
#   ACME_EMAIL              Let's Encrypt account email
#   TF_STATE_BUCKET         Object Storage bucket for tfstate
#   TF_STATE_REGION         location code (nbg1/fsn1/hel1)
#   TF_STATE_ENDPOINT       e.g. https://nbg1.your-objectstorage.com
#   ALLOWED_ADMIN_CIDRS     (optional) JSON list locking SSH/API, e.g. ["1.2.3.4/32"]
#
# The dashboard is NOT deployed here — it ships to Vercel separately (see
# docs). This workflow is the cluster/backend deploy only.

name: deploy-hetzner

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR image tag to deploy (e.g. v1.2.3 or sha-abc1234)"
        required: true
        default: "latest"
      auto_approve:
        description: "Run terraform apply (otherwise plan-only)"
        type: boolean
        default: false

concurrency:
  # Never run two deploys at once, and never cancel one mid-apply.
  group: deploy-hetzner
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_VERSION: "1.10.5" # has S3 use_lockfile; avoids the 1.11.2+ checksum regression
  ENV_DIR: infra/terraform/envs/hetzner

jobs:
  # --------------------------------------------------------------------------
  gate:
    name: helm + terraform gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: helm lint + template
        run: |
          helm lint infra/charts/darwin-platform
          helm template darwin infra/charts/darwin-platform \
            -f infra/charts/darwin-platform/tests/values-prod.yaml > /tmp/prod.yaml
          for kind in Deployment Service ServiceAccount NetworkPolicy Ingress; do
            grep -q "^kind: ${kind}$" /tmp/prod.yaml \
              || { echo "missing ${kind} in prod render"; exit 1; }
          done

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt + validate (no backend, no creds)
        run: |
          terraform fmt -check -recursive infra/terraform
          terraform -chdir=${{ env.ENV_DIR }} init -backend=false -input=false
          terraform -chdir=${{ env.ENV_DIR }} validate

  # --------------------------------------------------------------------------
  deploy:
    name: terraform apply (hetzner)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Gate the actual apply behind a GitHub Environment so you can require
    # reviewers / restrict secrets to production.
    environment: hetzner-prod
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Resolve image tag
        id: img
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.event.inputs.image_tag }}"
          fi
          # build.yml's semver tags drop the leading "v" (v0.0.6 → 0.0.6).
          case "$TAG" in v[0-9]*) TAG="${TAG#v}" ;; esac
          # GHCR image names must be lowercase.
          REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/$REPO/darwin-platform:$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying image: ghcr.io/$REPO/darwin-platform:$TAG"

      - name: Configure remote state backend
        run: |
          cat > ${{ env.ENV_DIR }}/backend.tf <<EOF
          terraform {
            backend "s3" {
              bucket = "${{ vars.TF_STATE_BUCKET }}"
              key    = "hetzner/prod/terraform.tfstate"
              region = "${{ vars.TF_STATE_REGION }}"
              endpoints                   = { s3 = "${{ vars.TF_STATE_ENDPOINT }}" }
              skip_credentials_validation = true
              skip_region_validation      = true
              skip_metadata_api_check     = true
              skip_requesting_account_id  = true
              use_path_style              = true
              use_lockfile                = true
              skip_s3_checksum            = true
            }
          }
          EOF

      - name: Compose Terraform variables
        run: |
          # Default optional secrets so an unset secret doesn't blank a value.
          echo "TF_VAR_litellm_master_key=${LITELLM_MASTER_KEY:-sk-hetzner-litellm-change-me}" >> "$GITHUB_ENV"
          if [ -n "${ALLOWED_ADMIN_CIDRS}" ]; then
            echo "TF_VAR_allowed_admin_cidrs=${ALLOWED_ADMIN_CIDRS}" >> "$GITHUB_ENV"
          fi
        env:
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          ALLOWED_ADMIN_CIDRS: ${{ vars.ALLOWED_ADMIN_CIDRS }}

      - name: terraform init
        working-directory: ${{ env.ENV_DIR }}
        run: terraform init -input=false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

      - name: terraform plan
        working-directory: ${{ env.ENV_DIR }}
        run: terraform plan -input=false -out=tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_public_key: ${{ secrets.TF_SSH_PUBLIC_KEY }}
          TF_VAR_ssh_private_key: ${{ secrets.TF_SSH_PRIVATE_KEY }}
          TF_VAR_domain: ${{ vars.DARWIN_DOMAIN }}
          TF_VAR_acme_email: ${{ vars.ACME_EMAIL }}
          TF_VAR_platform_image: ${{ steps.img.outputs.image }}

      - name: terraform apply
        # Apply on a published release, or on a dispatch with auto_approve.
        if: ${{ github.event_name == 'release' || github.event.inputs.auto_approve == 'true' }}
        working-directory: ${{ env.ENV_DIR }}
        run: terraform apply -input=false tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_public_key: ${{ secrets.TF_SSH_PUBLIC_KEY }}
          TF_VAR_ssh_private_key: ${{ secrets.TF_SSH_PRIVATE_KEY }}
          TF_VAR_domain: ${{ vars.DARWIN_DOMAIN }}
          TF_VAR_acme_email: ${{ vars.ACME_EMAIL }}
          TF_VAR_platform_image: ${{ steps.img.outputs.image }}

      - name: Post-apply reminder
        if: ${{ github.event_name == 'release' || github.event.inputs.auto_approve == 'true' }}
        run: |
          echo "::notice::Deployed ${{ steps.img.outputs.image }}. If this was the first apply, complete the manual steps in infra/terraform/envs/hetzner/README.md (DNS A record, Vault init/unseal + k8s-auth)."
