# Lint — ruff check + format check. Same trigger pattern as the test
# workflow so a PR's lint signal lands alongside its test signal.

name: lint

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch: {}
  # build.yml calls this so no image is published from a red commit.
  workflow_call: {}

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff check + format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dev deps
        # ruff/pytest live in [project.optional-dependencies].dev, not a
        # [dependency-groups] entry — --dev alone does not install them.
        run: uv sync --extra dev

      - name: ruff check
        run: uv run ruff check src tests tools

      - name: ruff format --check
        # Doesn't fail the build yet — formatting is opt-in until the
        # repo gets a one-time `ruff format .` commit.
        run: uv run ruff format --check src tests tools || true
