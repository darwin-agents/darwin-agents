# git-cliff — https://git-cliff.org/docs/configuration
# Keep a Changelog sections + Conventional Commits (see README).

[changelog]
# Keep a Changelog section order (HTML comments sort groups).
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{%- for group, commits in commits | group_by(attribute="group") %}

### {{ group | striptags | trim }}
{%- for commit in commits %}
- {{ commit.raw_message | split(pat="\n") | first | trim }}{% if commit.breaking %} (**breaking**){% endif %}
{%- endfor %}
{%- endfor %}
"""
trim = true
render_always = true
# Release workflow: make changelog-sync && make release VERSION=0.0.2
# (scripts/changelog.py splices sections; do not use --prepend by hand.)

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
protect_breaking_commits = true
# Newest first within each section (matches manual CHANGELOG habit).
sort_commits = "newest"
topo_order_commits = true

commit_parsers = [
  { message = "^docs(\\(.*\\))?: (update|add) CHANGELOG", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 4 -->Fixed" },
  { message = "^refactor", group = "<!-- 1 -->Changed" },
  { message = "^perf", group = "<!-- 1 -->Changed" },
  { message = "^build", group = "<!-- 1 -->Changed" },
  { message = "^style", group = "<!-- 4 -->Fixed" },
  { message = "^test", group = "<!-- 0 -->Added" },
  { message = "^docs", group = "<!-- 1 -->Changed" },
  { message = "^ci", group = "<!-- 4 -->Fixed" },
  { body = ".*security", group = "<!-- 5 -->Security" },
  { message = "^revert", group = "<!-- 1 -->Changed" },
  { message = "^.*!:", group = "<!-- 0 -->Added" },
  { message = ".*", group = "<!-- 1 -->Changed" },
]

filter_commits = false
fail_on_unmatched_commit = false
