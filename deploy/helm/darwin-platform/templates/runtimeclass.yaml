{{- if and (eq .Values.driver.mode "k8s") .Values.runtimeClass.create -}}
# Kata Containers RuntimeClass. Most operators install this via the
# Kata Containers operator (kata-deploy / kata-operator), which sets up
# the underlying CRI handler on nodes. When `runtimeClass.create=true`
# we add the RuntimeClass resource that references that handler so
# per-Darwin orchestrator pods can `runtimeClassName: kata`.
#
# Verify on a real cluster:
#
#   kubectl get runtimeclass {{ .Values.driver.runtimeClassName }}
#
# If the handler name differs (some distributions use `kata-clh` or
# `kata-fc`), set `runtimeClass.handler` accordingly.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ .Values.driver.runtimeClassName }}
  labels:
    {{- include "darwin-platform.labels" . | nindent 4 }}
handler: {{ .Values.runtimeClass.handler | quote }}
{{- with .Values.runtimeClass.scheduling }}
{{- if or .nodeSelector .tolerations }}
scheduling:
  {{- with .nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
