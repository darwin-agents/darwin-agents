{{- /*
  Provider secrets: API keys + webhook URLs for sinks, sanctions
  screener, fiat ramps. Rendered only when at least one inline value
  is set AND no existingSecret is referenced for that provider group.
  Production deployments should prefer the existingSecret path
  (ExternalSecrets / SealedSecrets / cloud-managed) and avoid putting
  secrets into the values file.
*/ -}}
{{- $sanctions := .Values.providers.sanctions }}
{{- $notif := .Values.providers.notifications }}
{{- $fiat := .Values.providers.fiat }}

{{- $hasSanctionsInline := and (not $sanctions.existingSecret) $sanctions.apiKey }}
{{- $hasNotifInline := and (not $notif.existingSecret)
    (or $notif.slackWebhookUrl $notif.escalationWebhookUrl
        $notif.alertWebhookUrl $notif.pagerdutyRoutingKey) }}
{{- $hasFiatInline := and (not $fiat.existingSecret)
    (or $fiat.stripeApiKey $fiat.moonpayApiKey) }}

{{- if or $hasSanctionsInline $hasNotifInline $hasFiatInline }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "darwin-platform.fullname" . }}-providers
  labels:
    {{- include "darwin-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $hasSanctionsInline }}
  sanctions-api-key: {{ $sanctions.apiKey | quote }}
  {{- end }}
  {{- if $notif.slackWebhookUrl }}
  darwin_slack_webhook_url: {{ $notif.slackWebhookUrl | quote }}
  {{- end }}
  {{- if $notif.escalationWebhookUrl }}
  darwin_escalation_webhook_url: {{ $notif.escalationWebhookUrl | quote }}
  {{- end }}
  {{- if $notif.alertWebhookUrl }}
  darwin_alert_webhook_url: {{ $notif.alertWebhookUrl | quote }}
  {{- end }}
  {{- if $notif.pagerdutyRoutingKey }}
  darwin_pagerduty_routing_key: {{ $notif.pagerdutyRoutingKey | quote }}
  {{- end }}
  {{- if $fiat.stripeApiKey }}
  stripe-api-key: {{ $fiat.stripeApiKey | quote }}
  {{- end }}
  {{- if $fiat.moonpayApiKey }}
  moonpay-api-key: {{ $fiat.moonpayApiKey | quote }}
  {{- end }}
{{- end }}
