{{- /*
  Render an inline Secret holding tokens.json when:
    auth.enabled = true AND auth.existingSecret is empty.
  When existingSecret is set, the operator manages the Secret out-of-band
  (ExternalSecrets, SealedSecrets, sops, etc.) — the chart never touches it.
*/ -}}
{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "darwin-platform.fullname" . }}-tokens
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "darwin-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  tokens.json: |
    {{- toJson .Values.auth.tokens | nindent 4 }}
{{- end }}
