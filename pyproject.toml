[project]
name = "darwin-dna"
version = "1.0.0"
description = "Darwin Layer 0 — the founding genome. The signed, immutable DNA every Darwin organism inherits."
readme = "README.md"
requires-python = ">=3.12"

# Layer 0's dependency budget is a curated allowlist (see docs/engineering/18).
# A supply-chain attack on a random transitive dependency must not be able to
# compromise the constitution. Anything not on this list lives in the soma.
#   stdlib · pydantic · cryptography · langgraph · litellm (client-only) · httpx · structlog
dependencies = [
    "pydantic>=2,<3",
    "cryptography>=42",
    "structlog>=24",
]

[project.optional-dependencies]
# langgraph + litellm + httpx are on the Layer 0 allowlist but the genome must
# boot and the simulation must run *offline and deterministically* without them.
# The orchestrator graph uses langgraph when importable and a behaviourally
# identical in-process runner otherwise (see orchestrator_skeleton/graph.py).
graph = ["langgraph>=0.2"]
llm = ["litellm>=1.40", "httpx>=0.27"]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/darwin_dna", "src/darwin_fakes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]
filterwarnings = ["error::DeprecationWarning"]
# docs/engineering/18 testing strategy: unit/integration run every commit;
# the simulation tier is heavier ("run nightly"). Mark it so a fast loop can
# `-m "not slow"` while CI/nightly runs everything (the default).
markers = [
    "slow: simulation-tier test (multi-day sim; minutes, not milliseconds)",
]

[tool.uv]
package = true
