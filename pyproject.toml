[project]
name = "darwin-dna"
version = "0.0.6"
description = "Darwin Layer 0 — the founding genome. The signed, immutable DNA every Darwin organism inherits."
readme = "README.md"
requires-python = ">=3.12"

# Layer 0's dependency budget is a curated allowlist (see docs/engineering/18).
# A supply-chain attack on a random transitive dependency must not be able to
# compromise the constitution. Anything not on this list lives in the soma.
#   stdlib · pydantic · cryptography · langgraph · litellm (client-only) · httpx · structlog
dependencies = [
    "pydantic>=2,<3",
    "cryptography>=42",
    "structlog>=24",
]

[project.optional-dependencies]
# langgraph + litellm + httpx are on the Layer 0 allowlist but the genome must
# boot and the simulation must run *offline and deterministically* without them.
# The orchestrator graph uses langgraph when importable and a behaviourally
# identical in-process runner otherwise (see orchestrator_skeleton/graph.py).
graph = ["langgraph>=0.2"]
llm = ["litellm>=1.40", "httpx>=0.27"]
# The platform control plane (docs/engineering/08): the Darwin Supervisor's
# HTTP surface and OpenTelemetry tracing. The Supervisor class itself has no
# FastAPI dependency and tracing falls back to a NoOp shim when OTel is
# absent, so tests can drive it on a slim install; the extra is for serving
# the REST API and producing real spans.
platform = [
    "fastapi>=0.110",
    # uvicorn runs the FastAPI app — `darwin-platform serve` needs it,
    # and the darwin-platform console script is only useful with it.
    "uvicorn>=0.30",
    "httpx>=0.27",
    # PyJWT (+ cryptography, already core) verifies Clerk-issued RS256 JWTs
    # against Clerk's JWKS for the control-plane auth layer (doc 08).
    "pyjwt[crypto]>=2.8",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    # OTLP/HTTP span exporter — lets `serve --otlp-endpoint` ship traces
    # to a collector (Jaeger in the dev compose stack). Optional at
    # runtime: tracing falls back to NoOp when no endpoint is configured.
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
# Postgres-backed persistence (doc 08 production posture). Pulls in
# psycopg 3 + the binary wheel so deployers don't need libpq-dev on the
# host. Without this extra the platform falls back to SQLite — the
# Supervisor accepts either a file path or a postgres:// DSN.
postgres = ["psycopg[binary]>=3.1"]
# Real wallet adapter (docs/engineering/17). web3.py talks to any
# EVM-compatible chain — Base Sepolia for testnet, Base for mainnet.
# Pulls in eth-account for local signing. Production deployers using
# Coinbase Agentic Wallets / CDP can swap this for their SDK behind
# the same :class:`darwin_platform.adapters.ChainClient` Protocol.
web3 = ["web3>=7.0"]
# Real Vault adapter (docs/engineering/16). hvac is HashiCorp's
# canonical Python client; this extra pulls it in for the
# :class:`darwin_platform.adapters.HvacVaultClient` wrapper.
hvac = ["hvac>=2.0"]
# Real browser substrate (docs/engineering/15). browser-use is the
# agent-shaped wrapper around Playwright; the Darwin platform's
# :class:`BrowserUseClient` runs it against a Browserbase backend.
browser = ["browser-use>=0.2"]
# Real microVM sandbox (docs/engineering/14). e2b-code-interpreter runs
# code in a fresh microVM per session (the base `e2b` package has no
# run_code — code execution lives in this package) — used by the mutation
# eval harness's "clean substrate" path and by code-running neurons.
e2b = ["e2b-code-interpreter>=1.0"]
# K8s driver (docs/engineering/08 production posture). Pulls in the
# kubernetes Python client so the supervisor can provision per-Darwin
# namespaces + workloads via the API. The driver also needs httpx
# (already on the [platform] extra) for RPC to orchestrator pods.
k8s = ["kubernetes>=29"]
# Solana fallback chain (docs/engineering/17 §multi-chain). The
# adapter's ``build_solana_chain_client`` wraps solana-py + solders
# (spl.token lives inside the ``solana`` package).
solana = ["solana>=0.34", "solders>=0.21"]
# Stellar fallback chain (docs/engineering/17 §multi-chain). Centre/
# Circle-issued USDC via stellar-sdk.
stellar = ["stellar-sdk>=10.0"]
# Stripe fiat ramp (docs/engineering/17 §fiat ramps). Card / ACH
# deposit via PaymentIntent + bank withdraw via Stripe Connect
# Transfer. MoonPay is HTTP-only (covered by the [platform] extra's
# httpx).
stripe = ["stripe>=8.0"]
# Coinbase CDP / Agentic Wallet (docs/engineering/05, 17). A non-custodial
# TEE-secured wallet — the per-Darwin private key lives in Coinbase's
# infrastructure, never in this process. ``CdpChainClient`` fronts it
# behind the same ``ChainClient`` Protocol as ``Web3ChainClient``.
cdp = ["cdp-sdk>=1.0"]
# Embedded PDF watermarking (docs/engineering/16). Round-3's
# HmacWatermarker appends a trailer after %%EOF; with pypdf it can
# also embed the HMAC into proper PDF metadata so a re-saved
# document still carries the trace. Optional — the trailer is the
# baseline; pypdf is the upgrade path.
pdfwatermark = ["pypdf>=4.0"]
# Per-Darwin vector memory (docs/engineering/03, 11). The genome ships a
# deterministic EpisodicMemory (sim parity, no model lock-in). With this
# extra the platform can inject ``LanceDbEpisodicMemory`` — embedded
# LanceDB, per-Darwin directory, vector recall. Optional and lazy: the
# import only runs when the platform actually chooses LanceDB.
lancedb = ["lancedb>=0.13"]
# Browser Use Cloud V3 Agent (docs/engineering/15, 31). Alternative to
# the existing OSS browser-use library on Browserbase wiring — the
# cloud's managed agent runs against Stealth Browsers + bundled
# proxies. Picked at deploy time via --browser-provider browser-use-cloud.
browser-use-cloud = ["browser-use-sdk>=3.4,<4"]
# Web Push for the PWA escalation companion (docs/engineering/22). Doc 22
# names "FCM / APNs"; with the PWA path we use the W3C Push API + VAPID
# instead, which avoids the FCM project + APNs cert setup. pywebpush
# handles VAPID signing + ECE payload encryption.
webpush = ["pywebpush>=2.0"]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    # Lint + format. Pinned to a known good version so CI is reproducible.
    "ruff>=0.6,<1.0",
]

[project.scripts]
# Console entry for ``darwin-platform serve --db ...``. Maps to
# darwin_platform/__main__.py:main. Only useful when the [platform]
# extra is installed (uvicorn).
darwin-platform = "darwin_platform.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/darwin_dna", "src/darwin_fakes", "src/darwin_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]
# Nested test packages without __init__.py: use importlib import mode so
# pytest doesn't mutate sys.path per test directory. Standard recommendation
# for src-layout projects with a tiered tests/ tree.
addopts = "--import-mode=importlib"
filterwarnings = [
    "error::DeprecationWarning",
    # web3.py 7.x transitively imports websockets.legacy on a path we
    # don't actually exercise (we sign + send via HTTP, never WS). The
    # warning is cosmetic for our usage; whitelist only that source so
    # the rest of the genome's deprecation-as-error policy stands.
    "ignore::DeprecationWarning:websockets.legacy",
    "ignore::DeprecationWarning:websockets",
]
# docs/engineering/26 (testing strategy): five tiers. Filenames live in
# tests/<tier>/ so `pytest tests/unit` runs a tier by path, and these
# markers let `pytest -m redteam` filter across paths when needed.
markers = [
    "slow: simulation-tier test (multi-day sim; minutes, not milliseconds)",
    "unit: tier-1 single-module unit test",
    "property: tier-2 hypothesis / property-based test",
    "redteam: tier-3 adversarial scenario from doc 24",
    "integration: tier-4 multi-module end-to-end flow",
    "simulation: tier-5 multi-day in-process simulation",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
# The genome ships with intentionally-long-lived strings (prompts, audit
# event templates) and Hypothesis tests use mid-line annotations; keep
# the rule set tight + focused so the lint signal is high.
extend-exclude = [
    "src/darwin_dna/orchestrator_skeleton/prompts",
]

[tool.ruff.lint]
# Conservative starting set the codebase already passes. We deliberately
# pick a narrow rule selection so CI lint signal is high — adding rules
# later is one commit; chasing a 100+ violation cleanup in one go just
# burns review time.
#
#   F   — pyflakes: real bugs (undefined names, unused locals).
#   E9  — pycodestyle: syntax errors only (skip whitespace/style noise).
#   PLE — pylint errors: semantic issues that aren't stylistic.
#
# Patterns deliberately not enforced yet: pyupgrade's StrEnum migration
# (UP042), import sorting, bugbear's raise-without-from. Each is a
# follow-up cleanup PR, not a CI gate.
select = ["F", "E9", "PLE"]
# F401 (unused-import) is the only F-rule that fires on the genome's
# re-export __init__.py modules. Those re-exports are deliberate; ignore
# F401 in package __init__ files.
per-file-ignores = { "**/__init__.py" = ["F401"] }
ignore = []
