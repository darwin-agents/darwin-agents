# Local dev stack for the Darwin platform (docs/engineering/20 §"Docker Compose").
#
# One command brings up the supervisor, the web dashboard, persistence,
# an LLM gateway, metrics, and tracing:
#
#     cd infra/docker && docker compose up --build
#
# Compose substitutes ${...} below from the repo-root .env. Wire it up
# with `--env-file ../../.env` (or use `make docker-up`, which already
# passes it). The repo-root .env.example is the single source of truth;
# this directory holds no .env of its own. Everything has a dev-only
# default so the stack comes up even with no .env — see infra/docker/README.md.

name: darwin-platform

services:
  # -- supervisor: the FastAPI control plane + per-Darwin drive loop ----
  supervisor:
    build:
      # Context is the repo root so the Dockerfile's COPY of pyproject /
      # uv.lock / src reaches the actual sources; the Dockerfile path is
      # resolved relative to that context.
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: darwin-platform:dev
    container_name: darwin-supervisor
    ports:
      - "8000:8000"
    volumes:
      - supervisor-data:/data
      # Live source mount (local dev/test): PYTHONPATH=/app/src wins over the
      # installed package, so local edits (e.g. the drive-task done-callback)
      # take effect on restart without a rebuild. Remove for a pure-image run.
      - ../../src:/app/src:ro
      # Bearer-token auth. tokens.json (owner-dev-token + ops-dev-token) is
      # mounted read-only and activated by the --auth-tokens flag below.
      # Comment both out to fall back to permissive (trust-every-caller) mode.
      - ./tokens.json:/run/secrets/tokens.json:ro
    command:
      - python
      - -m
      - darwin_platform
      - serve
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      # Local dev convenience: expose Swagger UI (/docs), ReDoc (/redoc) and
      # /openapi.json. Off by default in the app; this is a local-only stack
      # so it's safe here. Drop --enable-docs for any internet-facing run.
      - --enable-docs
      # Persistence — Postgres (restart-survivable; the service is
      # healthy-gated via depends_on below). Swap back to the SQLite line
      # (--db /data/state.db) for a dependency-free dev run.
      - --db
      - postgresql://${POSTGRES_USER:-darwin}:${POSTGRES_PASSWORD:-dev_only_password}@postgres:5432/${POSTGRES_DB:-darwin}
      # Wallet: 'web3' with no RPC/key env falls back to the in-process
      # FakeWallet (instant spend bookkeeping, no faucet). Switch to 'cdp'
      # (+ CDP_* env) or 'local-vault' (+ RPC URLs) for real on-chain money.
      - --wallet-provider
      - web3
      # real LLM through the bundled LiteLLM proxy (doc 13). Without this
      # the supervisor falls back to the deterministic FakeLLM.
      - --litellm-url
      - http://litellm:4000
      - --litellm-master-key
      - dev_only_master_key
      # real code-running sandbox neuron (doc 14). Empty E2B_API_KEY ->
      # silently degrades back to FakeSandbox.
      - --e2b-api-key
      - ${E2B_API_KEY}
      # real browser neuron (doc 15). Empty Browserbase creds -> FakeBrowser.
      - --browser-provider
      - browserbase
      - --browserbase-url
      - ${BROWSERBASE_URL}
      - --browserbase-api-key
      - ${BROWSERBASE_API_KEY}
      # Auth — bearer tokens from the tokens.json mount above. Without this
      # (and the mount) the API trusts every caller.
      - --auth-tokens
      - /run/secrets/tokens.json
      # Tracing — export spans (OTLP/HTTP) to the bundled OTel collector
      # (doc 22). Empty/down collector just means spans are dropped; the
      # supervisor runs unaffected.
      - --otlp-endpoint
      - http://otel-collector:4318
    depends_on:
      # Postgres must be healthy before the supervisor opens its pool;
      # litellm before the genome's first real LLM call.
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started
    restart: unless-stopped
    # The image already declares a /healthz HEALTHCHECK; Compose inherits it.

  # -- web: Next.js dashboard (docs/frontend) --------------------------
  # The dashboard ships as its own artifact (Vercel / edge host in
  # production); it lives here so `make docker-up` brings up a complete
  # local loop — UI on :3000 talking to the supervisor on :8000.
  #
  # NEXT_PUBLIC_* are inlined into the browser bundle at BUILD time, so
  # they're build args, not runtime env. NEXT_PUBLIC_API_BASE_URL must be
  # the *host* URL the browser can reach (localhost:8000), NOT the
  # in-cluster DNS name `supervisor` — those API calls run in the user's
  # browser, not inside this container.
  web:
    build:
      # The web Dockerfile's `COPY . .` expects the web/ dir as its
      # context (not the repo root like the supervisor uses).
      context: ../../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        # Dev-only: a non-empty token skips the dashboard's token-paste
        # gate. The default compose supervisor runs permissive (no
        # --auth-tokens mounted), so any value authenticates; this matches
        # the owner token in tokens.example.json if you do enable auth.
        NEXT_PUBLIC_DEV_BEARER_TOKEN: ${NEXT_PUBLIC_DEV_BEARER_TOKEN:-owner-dev-token}
    image: darwin-web:dev
    container_name: darwin-web
    ports:
      - "3000:3000"
    environment:
      # Runtime-only server var, used when Clerk auth is enabled.
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    depends_on:
      supervisor:
        condition: service_started
    restart: unless-stopped

  # -- postgres: optional restart-survivable backend --------------------
  postgres:
    image: postgres:16-alpine
    container_name: darwin-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-darwin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_password}
      POSTGRES_DB: ${POSTGRES_DB:-darwin}
    ports:
      # Host 15432 -> container 5432 (host 5432 is used by another local
      # project; the supervisor reaches PG via the internal DNS name
      # `postgres:5432`, so this remap is host-side only).
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-darwin} -d ${POSTGRES_DB:-darwin}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # -- redis: LiteLLM response cache + cross-replica rate limits -------
  redis:
    image: redis:7-alpine
    container_name: darwin-redis
    ports:
      # Host 16379 -> container 6379 (host 6379 is used by another local
      # project; litellm reaches redis via the internal DNS name `redis`).
      - "16379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # -- litellm: real LLM gateway (doc 13) ------------------------------
  # On :4000. The supervisor routes through it when started with
  # --litellm-url; otherwise it uses the deterministic FakeLLM. The
  # Redis-backed response cache is configured in litellm.config.yaml.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: darwin-litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      # Provider keys for the model_list in litellm.config.yaml. Empty
      # when no .env is present — litellm still boots; model calls fail.
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Proxy master key — must match what the bare-metal supervisor sends
      # via --litellm-master-key (sourced from the same .env). Falls back to
      # the dev default when unset so a keyless compose run still boots.
      DARWIN_LITELLM_MASTER_KEY: ${DARWIN_LITELLM_MASTER_KEY:-dev_only_master_key}
      # Redis connection for the response cache (see litellm.config.yaml).
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Postgres backing per-Darwin virtual keys + the per-key spend table
      # (doc 13). Without it /key/generate has nowhere to persist keys, so the
      # supervisor's --litellm-virtual-keys mode can't mint them. Reuses the
      # compose postgres (LiteLLM namespaces its own `LiteLLM_*` tables, so it
      # coexists with the supervisor's schema in the same database).
      DATABASE_URL: ${LITELLM_DATABASE_URL:-postgresql://${POSTGRES_USER:-darwin}:${POSTGRES_PASSWORD:-dev_only_password}@postgres:5432/${POSTGRES_DB:-darwin}}
      STORE_MODEL_IN_DB: "True"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # -- prometheus: scrapes supervisor /metrics every 15s ---------------
  prometheus:
    image: prom/prometheus:latest
    container_name: darwin-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerting_rules.yml:/etc/prometheus/alerting_rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - supervisor
    restart: unless-stopped

  # -- otel-collector: receives the supervisor's OTLP spans (doc 22) ----
  # On :4318 (OTLP/HTTP) + :4317 (gRPC); :8888 exposes its own metrics for
  # Prometheus. Local dev logs spans (debug exporter); prod swaps in a tracing
  # backend (Jaeger/Tempo/OTLP cloud).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: darwin-otel-collector
    command: ["--config", "/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"
      - "4317:4317"
    depends_on:
      - jaeger
    restart: unless-stopped

  # -- jaeger: tracing backend + UI for the collector's spans (doc 22) --
  # Accepts OTLP from the collector (COLLECTOR_OTLP_ENABLED) and serves the
  # trace-explorer UI on :16686. All-in-one (memory store) — fine for dev; a
  # prod install uses a persistent backend (Tempo / Elasticsearch).
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: darwin-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # trace UI
      - "4317:4317"     # OTLP gRPC (direct debug; collector uses jaeger:4317)
      - "4318:4318"     # OTLP HTTP
    restart: unless-stopped

  # -- alertmanager: routes Prometheus alerts to receivers (doc 22) -----
  # Prometheus forwards firing alerts here (see prometheus.yml `alerting:`);
  # it groups/inhibits and webhooks them out. Point the receivers at a real
  # Slack/PagerDuty endpoint for production.
  alertmanager:
    image: prom/alertmanager:latest
    container_name: darwin-alertmanager
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    restart: unless-stopped

volumes:
  supervisor-data:
  postgres-data:
  prometheus-data:
  redis-data:
