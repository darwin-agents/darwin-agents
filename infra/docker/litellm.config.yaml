# LiteLLM proxy config (docs/engineering/13).
#
# Maps the genome's capability tiers (fast / reasoning / coding / etc.) to
# real provider models. The supervisor's LiteLLMTransport sends requests
# tier-by-tier; LiteLLM resolves the chain and routes to the cheapest /
# fastest healthy upstream. Provider API keys come from the repo-root .env.
#
# This is a STARTING config — the model_list entries should be tuned to
# the platform's actual contracts. The price_table is what LiteLLM uses
# for per-call cost extraction (which the supervisor's billing layer
# attributes platform revenue from).

model_list:
  # tier=fast — snap judgments, classification, routing
  - model_name: tier-fast
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/CLAUDE_API_KEY
  - model_name: tier-fast
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY

  # tier=balanced — day-to-day reasoning + content generation; the soft
  # degrade target for tier=reasoning (doc 13 capability-profile table). One
  # band cheaper than reasoning, one band smarter than fast.
  - model_name: tier-balanced
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/CLAUDE_API_KEY
  - model_name: tier-balanced
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY

  # tier=reasoning — the planner; the default thinking tier. Production
  # quality requires Sonnet; for fast local interaction testing swap the
  # model to anthropic/claude-haiku-4-5-20251001 (~5-10s/call) — that is a
  # LOCAL-DEV override only, never commit it as the default.
  - model_name: tier-reasoning
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/CLAUDE_API_KEY

  # tier=coding — self-modification; expensive, gated hard. Uses the most
  # capable model (Opus). Local-dev may swap to haiku for speed; never
  # commit that as the default.
  - model_name: tier-coding
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: os.environ/CLAUDE_API_KEY

  # tier=embedding — episodic memory + retrieval
  - model_name: tier-embedding
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

router_settings:
  # Cost-based routing (doc 13 §"Why LiteLLM"): per-Darwin spend is metered
  # into treasuries, so the gateway picks the cheapest healthy upstream that
  # meets the tier bar rather than the lowest-latency one.
  routing_strategy: cost-based-routing
  # One retry per call, then the soma decides (doc 13 §"Failover": "Per-call
  # retry budget is small (one retry)"). Beyond that we degrade tier rather
  # than block.
  num_retries: 1
  fallbacks:
    # Degrade rather than fail outright. doc 13 §"Failover". Reasoning steps
    # down through balanced before fast so quality drops one band at a time.
    - tier-reasoning: ["tier-balanced", "tier-fast"]
    - tier-balanced: ["tier-fast"]
    - tier-coding: ["tier-reasoning"]

litellm_settings:
  # Prometheus exporter (doc 13 §Observability: "LiteLLM emits Prometheus
  # metrics out of the box"). Exposes per-model latency / error-rate / token /
  # per-virtual-key cost counters on the proxy's /metrics; the bundled
  # Prometheus scrapes litellm:4000 (see prometheus.yml).
  callbacks: ["prometheus"]
  # Redis-backed response cache (docs/engineering/13, 19). Identical
  # tier+prompt requests are served from cache — repeat planner / research
  # calls stop costing money. The same Redis coordinates cross-replica
  # rate limits when the proxy is scaled out. Connection comes from the
  # environment (docker-compose wires the bundled redis service); if Redis
  # is unreachable the proxy still boots — it just runs uncached.
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD

general_settings:
  # The master key is the proxy's admin credential. With STORE_MODEL_IN_DB
  # and DATABASE_URL set (docker-compose wires both), it authenticates the
  # platform's /key/generate calls that mint one virtual key per Darwin
  # (doc 13) — the keys + their per-key spend live in Postgres, which is what
  # the platform's spend reconciler reads. Without a DATABASE_URL the proxy
  # still boots but virtual keys are not persisted (shared-master-key mode,
  # dev only).
  master_key: os.environ/DARWIN_LITELLM_MASTER_KEY
