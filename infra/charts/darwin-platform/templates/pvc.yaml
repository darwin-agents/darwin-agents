{{- $usePostgres := or .Values.database.url .Values.database.existingSecret -}}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) (not $usePostgres) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "darwin-platform.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "darwin-platform.labels" . | nindent 4 }}
  # helm.sh/resource-policy=keep so a `helm uninstall` does NOT delete
  # the durable state (audit chain, billing). Operators delete the PVC
  # explicitly when they want to wipe.
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
{{- end }}
