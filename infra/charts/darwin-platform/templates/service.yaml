apiVersion: v1
kind: Service
metadata:
  name: {{ include "darwin-platform.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "darwin-platform.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      protocol: TCP
      targetPort: http
  selector:
    {{- include "darwin-platform.selectorLabels" . | nindent 4 }}
