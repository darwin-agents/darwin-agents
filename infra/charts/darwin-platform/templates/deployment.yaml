{{- $usePostgres := or .Values.database.url .Values.database.existingSecret -}}
{{- $haEnabled := .Values.leaderElection.enabled -}}
{{- if and $haEnabled (not $usePostgres) -}}
{{- fail "leaderElection.enabled requires database.url or database.existingSecret (Postgres-backed persistence is the prerequisite)" -}}
{{- end -}}
{{- if and (gt (int .Values.replicaCount) 1) (not $haEnabled) -}}
{{- fail "replicaCount > 1 requires leaderElection.enabled — multiple writers without leader election corrupt the audit chain" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "darwin-platform.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "darwin-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # With HA on, followers serve /readyz=503 while a rolling restart
  # cycles pods — the Service routes only to the leader. Without HA,
  # Recreate prevents two writers from overlapping during an update.
  strategy:
    type: {{ if $haEnabled }}RollingUpdate{{ else }}Recreate{{ end }}
    {{- if $haEnabled }}
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- end }}
  selector:
    matchLabels:
      {{- include "darwin-platform.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "darwin-platform.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "darwin-platform.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: supervisor
          image: "{{ .Values.image.repository }}:{{ include "darwin-platform.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args:
            - python
            - -m
            - darwin_platform
            - serve
            - --host=0.0.0.0
            - --port=8000
            {{- if $usePostgres }}
            # Postgres mode: --db expands DATABASE_URL via the
            # container's env-var substitution (set below from either an
            # inline value or an existing Secret).
            - --db=$(DATABASE_URL)
            {{- else if .Values.persistence.enabled }}
            - --db=/data/state.db
            {{- end }}
            {{- if .Values.auth.enabled }}
            - --auth-tokens=/run/secrets/tokens.json
            {{- end }}
            {{- if $haEnabled }}
            - --leader-election
            {{- if .Values.leaderElection.lockKey }}
            - --leader-lock-key={{ .Values.leaderElection.lockKey }}
            {{- end }}
            {{- end }}
            {{- if .Values.walletProvider }}
            # Forwarded into each spawned Darwin's DarwinPodConfig (the
            # supervisor itself holds no wallet in k8s mode).
            - --wallet-provider={{ .Values.walletProvider }}
            {{- end }}
            {{- if .Values.heartbeatSeconds }}
            - --heartbeat-seconds={{ .Values.heartbeatSeconds }}
            {{- end }}
            {{- if eq .Values.driver.mode "k8s" }}
            - --driver=k8s
            - --k8s-namespace-prefix={{ .Values.driver.namespacePrefix }}
            - --k8s-runtime-class={{ .Values.driver.runtimeClassName }}
            - --k8s-egress-proxy-namespace={{ .Values.platformDataNamespace.name }}
            - --k8s-lancedb-image={{ .Values.driver.lancedb.image }}
            - --k8s-lancedb-storage-size={{ .Values.driver.lancedb.storageSize }}
            {{- if .Values.driver.lancedb.storageClass }}
            - --k8s-lancedb-storage-class={{ .Values.driver.lancedb.storageClass }}
            {{- end }}
            {{- if .Values.driver.orchestrator.image.repository }}
            - --k8s-orchestrator-image={{ .Values.driver.orchestrator.image.repository }}:{{ default (include "darwin-platform.imageTag" .) .Values.driver.orchestrator.image.tag }}
            {{- else }}
            - --k8s-orchestrator-image={{ .Values.image.repository }}:{{ include "darwin-platform.imageTag" . }}
            {{- end }}
            {{- if .Values.postgresEgress.namespace }}
            - --k8s-postgres-namespace={{ .Values.postgresEgress.namespace }}
            - --k8s-postgres-pod-label={{ .Values.postgresEgress.podLabelKey }}={{ .Values.postgresEgress.podLabelValue }}
            - --k8s-postgres-port={{ .Values.postgresEgress.port }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            # The supervisor's own namespace, via the downward API. The
            # k8s driver stamps each per-Darwin NetworkPolicy with an
            # ingress rule allowing the orchestrator control port ONLY from
            # the supervisor pod in this namespace. Without POD_NAMESPACE the
            # driver falls back to "default", so on a NetworkPolicy-enforcing
            # CNI (kindnet, Cilium, Calico) the supervisor->orchestrator RPC
            # is dropped and every spawn hangs "did not become ready".
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if $usePostgres }}
            - name: DATABASE_URL
              {{- if .Values.database.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey | default "DATABASE_URL" }}
              {{- else }}
              value: {{ .Values.database.url | quote }}
              {{- end }}
            {{- end }}
            {{- if .Values.tracing.endpoint }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.tracing.serviceName | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.tracing.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.tracing.protocol | quote }}
            {{- end }}
            {{- $sanctions := .Values.providers.sanctions }}
            {{- if $sanctions.existingSecret }}
            - name: DARWIN_SANCTIONS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $sanctions.existingSecret }}
                  key: sanctions-api-key
                  optional: true
            {{- else if $sanctions.apiKey }}
            - name: DARWIN_SANCTIONS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "darwin-platform.fullname" . }}-providers
                  key: sanctions-api-key
            {{- end }}
            {{- $notif := .Values.providers.notifications }}
            {{- if $notif.existingSecret }}
            {{- range $envname := list "DARWIN_SLACK_WEBHOOK_URL" "DARWIN_ESCALATION_WEBHOOK_URL" "DARWIN_ALERT_WEBHOOK_URL" "DARWIN_PAGERDUTY_ROUTING_KEY" }}
            - name: {{ $envname }}
              valueFrom:
                secretKeyRef:
                  name: {{ $notif.existingSecret }}
                  key: {{ $envname | lower }}
                  optional: true
            {{- end }}
            {{- else if or $notif.slackWebhookUrl $notif.escalationWebhookUrl $notif.alertWebhookUrl $notif.pagerdutyRoutingKey }}
            {{- range $envname, $present := dict
                "DARWIN_SLACK_WEBHOOK_URL" $notif.slackWebhookUrl
                "DARWIN_ESCALATION_WEBHOOK_URL" $notif.escalationWebhookUrl
                "DARWIN_ALERT_WEBHOOK_URL" $notif.alertWebhookUrl
                "DARWIN_PAGERDUTY_ROUTING_KEY" $notif.pagerdutyRoutingKey }}
            {{- if $present }}
            - name: {{ $envname }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "darwin-platform.fullname" $ }}-providers
                  key: {{ $envname | lower }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- $fiat := .Values.providers.fiat }}
            {{- if $fiat.existingSecret }}
            - name: STRIPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fiat.existingSecret }}
                  key: stripe-api-key
                  optional: true
            - name: MOONPAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fiat.existingSecret }}
                  key: moonpay-api-key
                  optional: true
            {{- else if or $fiat.stripeApiKey $fiat.moonpayApiKey }}
            {{- if $fiat.stripeApiKey }}
            - name: STRIPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "darwin-platform.fullname" . }}-providers
                  key: stripe-api-key
            {{- end }}
            {{- if $fiat.moonpayApiKey }}
            - name: MOONPAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "darwin-platform.fullname" . }}-providers
                  key: moonpay-api-key
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              # With HA on, readiness == leader. The Service excludes
              # followers via this probe so writes always hit whoever
              # holds the lock. Without HA, /healthz suffices.
              path: {{ if $haEnabled }}/readyz{{ else }}/healthz{{ end }}
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            # Liveness is more forgiving than readiness — bouncing the
            # process needlessly costs an audit-anchor write and the
            # drive-task restart cost.
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if and .Values.persistence.enabled (not $usePostgres) }}
            - name: data
              mountPath: /data
            {{- end }}
            {{- if .Values.auth.enabled }}
            - name: tokens
              mountPath: /run/secrets
              readOnly: true
            {{- end }}
      volumes:
        {{- if and .Values.persistence.enabled (not $usePostgres) }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" (include "darwin-platform.fullname" .)) .Values.persistence.existingClaim }}
        {{- end }}
        {{- if .Values.auth.enabled }}
        - name: tokens
          secret:
            secretName: {{ default (printf "%s-tokens" (include "darwin-platform.fullname" .)) .Values.auth.existingSecret }}
            items:
              - key: {{ .Values.auth.existingSecretKey | default "tokens.json" }}
                path: tokens.json
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
