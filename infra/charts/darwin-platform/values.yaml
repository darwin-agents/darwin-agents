# Default values for darwin-platform.
#
# Override per-environment via -f values-prod.yaml or --set.
# Every section's first line documents the design intent; pick values
# in context, not in isolation.

# -- Container image --------------------------------------------------------
image:
  # Default pulls from GHCR; the build.yml workflow pushes here on every
  # commit to main + every tag. Pin a sha-XXXXXX tag for production
  # rollouts — `latest` is for dev only.
  repository: ghcr.io/quantium-rock/darwin-agent/darwin-platform
  tag: ""  # Empty falls back to Chart.appVersion; set to sha-XXXXXX in prod.
  pullPolicy: IfNotPresent
  # imagePullSecrets if the image is private. Skip for public images.
  pullSecrets: []

# -- Replicas ---------------------------------------------------------------
# Supervisor is single-writer per process. With Postgres + leader
# election (see `leaderElection.enabled` below), replicas > 1 is safe:
# exactly one pod holds the lock and drives Darwins; the rest are warm
# spares that take over within seconds of the leader dropping. With
# SQLite (or NoLeaderElection), keep at 1 — multiple processes writing
# to the same SQLite file is undefined and would corrupt the audit
# chain.
replicaCount: 1

# -- Leader election (HA) ---------------------------------------------------
# Required when ``replicaCount > 1``. Uses Postgres advisory locks
# (``pg_try_advisory_lock``) — held while the locking connection is
# alive; auto-released on pod death. Failover window ≈ heartbeat
# interval (5s default).
#
# Enabling this implicitly switches the readinessProbe to ``/readyz``
# so the Service routes API traffic only to the leader pod. Followers
# stay alive (``/healthz`` 200) for fast failover but report 503 on
# ``/readyz``.
leaderElection:
  enabled: false
  # The advisory-lock key. Default is a fixed hash so chart releases
  # don't collide unless an operator aligns them on purpose. Override
  # to isolate multiple platforms sharing one Postgres.
  lockKey: ""  # empty → use the supervisor's DEFAULT_LOCK_KEY

# -- Resources --------------------------------------------------------------
# Generous defaults for a small fleet; tune for actual load. The
# supervisor is CPU-light (just async coordination + SQLite writes) and
# memory grows with the number of running Darwins.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# -- Security context -------------------------------------------------------
# The image's Dockerfile already creates a non-root `darwin` user (UID 1000);
# we double-down here in case the image is overridden. Read-only root FS is
# off by default — uvicorn writes to a few cache dirs at startup.
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

# -- Persistence ------------------------------------------------------------
# The supervisor writes durable state (audit chain, tokens, billing,
# lineage, escalation tickets, monitor alerts) to one of two backends:
#
#   - SQLite: one file at /data/state.db on a PVC. Right for the
#     single-process posture this chart pins to today (replicaCount=1).
#   - Postgres: connection string via `database.url`. Right for HA when
#     the leader-election layer lands; also better backup/restore
#     ergonomics. Mount the URL via `database.existingSecret`.
#
# When `database.url` is set OR `database.existingSecret` is set, the
# chart skips the PVC entirely — the supervisor connects to the URL
# instead. SQLite vs Postgres detection happens at the persistence
# layer (postgres:// prefix → Postgres).
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  existingClaim: ""

database:
  # postgresql:// or postgres:// connection string. Overrides the
  # SQLite PVC mode when set.
  url: ""  # e.g. postgresql://darwin:CHANGE_ME@postgres-rw:5432/darwin
  # Reference an existing Secret with a `DATABASE_URL` key for
  # production deployments (ExternalSecrets / SealedSecrets).
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"

# -- Service ----------------------------------------------------------------
service:
  type: ClusterIP
  port: 8000
  # The metrics + healthz endpoints share the main port (no separate
  # admin port). Ingress should rate-limit / firewall accordingly.

# -- Ingress (optional) -----------------------------------------------------
# Enable to expose the API outside the cluster. ALWAYS layer TLS + auth
# in front (the supervisor's bearer-token auth is opt-in; do not expose
# auth-disabled mode publicly).
ingress:
  enabled: false
  className: ""  # e.g. "nginx" or "traefik"
  annotations: {}
  hosts:
    - host: darwin.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: darwin-tls
  #   hosts:
  #     - darwin.example.com

# -- Auth (bearer tokens) --------------------------------------------------
# Three modes:
#   1. enabled=false (default)  → trust-everyone; for local-dev only.
#   2. enabled=true + tokens   → chart renders a Secret from the literal
#                                tokens list below. Convenient for
#                                bootstrapping, but the values file ends
#                                up holding the secrets — protect it.
#   3. enabled=true + existingSecret → reference a Secret you manage
#                                      out-of-band (ExternalSecrets,
#                                      SealedSecrets, etc.). Preferred
#                                      for production.
#
# The mounted secret is one JSON file at /run/secrets/tokens.json
# matching the shape in docker/tokens.example.json.
auth:
  enabled: false
  # In-line tokens (mode 2) — DO NOT commit a populated values.yaml.
  # Each entry: {token, scopes, subject?, owned_darwins?}.
  tokens: []
  # - token: "owner-prod-abc123"
  #   scopes: ["owner"]
  #   subject: "alice@example.com"
  # - token: "ops-prod-xyz789"
  #   scopes: ["platform_operator"]
  #   subject: "ops@darwin.local"
  existingSecret: ""  # mode 3: name of a pre-created Secret
  existingSecretKey: "tokens.json"  # key within the existing secret

# -- Tracing / OTel --------------------------------------------------------
# OTLP endpoint for the genome's tracing module (see
# darwin_platform.tracing). Empty disables tracing in dev.
tracing:
  endpoint: ""  # e.g. http://jaeger-collector.observability:4318
  protocol: "http/protobuf"
  serviceName: "darwin-supervisor"

# -- External provider integrations ----------------------------------------
# All optional. Each block follows the same pattern:
#   1. Set the relevant fields below to enable the integration; OR
#   2. Reference a pre-existing Secret via ``existingSecret`` so the
#      chart projects its keys as env without copying secrets into
#      this values file.
# Either path injects the right ``--*`` CLI flag or env var; the
# supervisor's ``_build_*`` builders consume the env at startup.
providers:
  # ---- sanctions screening (doc 17) -----------------------------------
  # provider ∈ {"local", "chainalysis", "trm"}. Default "local" with no
  # denylist file is the no-op posture.
  sanctions:
    provider: "local"
    apiKey: ""  # for chainalysis | trm — rendered into the Secret
    # When set, the chart mounts /run/secrets/denylist.json + passes
    # --sanctions-denylist to the supervisor. Provide either the inline
    # JSON OR an existingSecret name.
    denylist: ""  # raw JSON string; see docs for the shape
    existingSecret: ""

  # ---- notification + alert sinks (doc 08) ----------------------------
  # Every URL/key may be inline OR read from an existing Secret via
  # ``existingSecret`` (one Secret carries all sink keys; matches the
  # ExternalSecrets pattern most production deploys use).
  notifications:
    slackWebhookUrl: ""        # https://hooks.slack.com/services/...
    escalationWebhookUrl: ""   # generic JSON-POST URL
    alertWebhookUrl: ""        # monitor alerts → generic webhook
    pagerdutyRoutingKey: ""    # PagerDuty Events v2 routing key
    existingSecret: ""

  # ---- fiat ramps (doc 17) --------------------------------------------
  # Stripe + MoonPay live behind separate, optional Secret refs. Each
  # is read by the supervisor's _build_fiat_ramp helper (operator-side
  # wiring; not in CLI today — set the env vars directly).
  fiat:
    stripeApiKey: ""
    moonpayApiKey: ""
    existingSecret: ""

# -- ServiceMonitor (kube-prometheus-stack discovery) ----------------------
# Off by default — set true if you have prometheus-operator installed
# and want auto-discovery of the /metrics endpoint. The chart's plain
# /metrics endpoint also works fine with manual scrape configs.
serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 10s
  # Labels to add so a prometheus-operator's Prometheus resource selects
  # this monitor. Typically `release: prometheus` for kube-prometheus-stack.
  labels: {}
  namespace: ""  # defaults to Release.Namespace

# -- NetworkPolicy ---------------------------------------------------------
# Default-deny egress + targeted allow rules. Doc 08 §"Outbound network
# filter" wants the egress proxy to refuse unsanctioned destinations; at
# the K8s layer, NetworkPolicy is the same idea — deny everything except
# explicitly-allowed targets (DNS, the LiteLLM proxy, the OTLP collector,
# Postgres when we get there).
networkPolicy:
  enabled: true
  ingress:
    # Allow incoming HTTP from any pod with this label set. Tighten in
    # production to specific namespaces / service-meshes.
    from:
      - podSelector:
          matchLabels:
            darwin.io/api-client: "true"
    extraRules: []
  egress:
    # DNS is always required.
    dns: true
    # LiteLLM endpoint: matched by namespace + label. Empty disables.
    litellm:
      namespace: ""  # e.g. "ml-gateway"
      podLabels: {}  # e.g. {app: litellm}
      port: 4000
    # OTLP collector (Jaeger / Tempo / Honeycomb agent).
    otlp:
      namespace: ""  # e.g. "observability"
      podLabels: {}
      ports: [4317, 4318]
    # Postgres (reserved for the future Postgres persistence port).
    postgres:
      namespace: ""
      podLabels: {}
      port: 5432
    # Arbitrary CIDRs (e.g. Coinbase APIs when the real wallet adapter
    # lands). One entry per public destination.
    extraCIDRs: []
    # - cidr: 0.0.0.0/0
    #   ports: [443]

# -- Pod-level extras ------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
extraEnv: []
# - name: SOMETHING_EXTRA
#   value: "x"

# -- Service account -------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}
  # automountServiceAccountToken: false  # tighten for least-privilege

# -- Pod disruption budget -------------------------------------------------
# Single-replica deployment doesn't benefit from a PDB (a PDB with
# minAvailable=1 + replicas=1 would block voluntary disruptions
# entirely). Re-enable when the supervisor goes HA via Postgres
# persistence + leader election.
podDisruptionBudget:
  enabled: false

# -- Driver mode (in-process vs K8s) ---------------------------------------
# `in-process` (default): every Darwin is an asyncio.Task in the
# supervisor pod. Right for dev + single-tenant deploys.
# `k8s`: each Darwin gets its own `darwin-{id}` namespace + orchestrator
# pod (`runtimeClassName: kata`) + LanceDB sidecar + NetworkPolicy
# constraining egress to the platform egress proxy. The supervisor pod
# manages those resources via the kubernetes API and drives lifecycle
# over HTTP RPC. Doc-08's production posture.
driver:
  mode: "in-process"
  # When mode=k8s, the supervisor needs a ServiceAccount with cluster-
  # wide permission to create/delete namespaces matching the prefix.
  # See templates/rbac.yaml for the granted verbs.
  namespacePrefix: "darwin-"
  # Kata RuntimeClass name. The chart's templates/runtimeclass.yaml
  # creates this RuntimeClass when `runtimeClass.create=true`; or
  # reference an existing one (e.g. installed by Kata Containers).
  runtimeClassName: "kata"
  # Per-Darwin orchestrator pod shape. Most operators will want to
  # adjust resources; image defaults to the same image as the
  # supervisor (the entrypoint differs).
  orchestrator:
    image:
      repository: ""  # empty → reuse .Values.image.repository
      tag: ""         # empty → reuse the supervisor's tag
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  # LanceDB sidecar — lightweight vector store the genome's memory
  # layer writes through. PVC per Darwin.
  lancedb:
    image: "lancedb/lancedb:latest"
    storageSize: 1Gi
    storageClass: ""  # empty → cluster default

# -- RuntimeClass (Kata Containers) ----------------------------------------
# When `runtimeClass.create=true`, the chart installs a RuntimeClass
# resource named per `driver.runtimeClassName`. Most operators install
# Kata via the Kata Containers operator; in that case leave create=false
# and reference the operator-installed name.
runtimeClass:
  create: false
  handler: "kata"  # the CRI-O / containerd runtime handler the node has
  # Node selector for kata-capable nodes (set by the Kata operator).
  scheduling:
    nodeSelector: {}
    tolerations: []

# -- Platform-data namespace (where the egress proxy lives) ----------------
# Per-Darwin NetworkPolicies allow egress only to this namespace's
# `darwin.io/component=egress-proxy` pods. The chart will create the
# namespace when `platformDataNamespace.create=true` AND `egressProxy.
# enabled=true`; otherwise the operator must create it out-of-band.
platformDataNamespace:
  create: true
  name: "platform-data"
  labels: {}

# -- Egress proxy (platform-data) ------------------------------------------
# The single outbound choke-point every per-Darwin NetworkPolicy allows.
# Refuses traffic to destinations not on the allowlist; logs every
# attempt for compliance review.
egressProxy:
  enabled: true
  image:
    repository: ""   # empty → reuse the supervisor image
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # The destination allowlist. Each entry: host_suffix (literal or
  # ".suffix"), optional port, schemes, methods. Defaults cover the
  # substrates a typical Darwin reaches (LiteLLM via OpenAI/Anthropic,
  # Browserbase, Coinbase, MoonPay, Stripe). Operators tune for their
  # actual fleet.
  allowlist:
    entries:
      - host_suffix: ".anthropic.com"
        schemes: ["https"]
        methods: ["GET", "POST"]
        note: "Anthropic via LiteLLM"
      - host_suffix: ".openai.com"
        schemes: ["https"]
        methods: ["GET", "POST"]
        note: "OpenAI via LiteLLM"
      - host_suffix: ".browserbase.com"
        schemes: ["https"]
        methods: ["GET", "POST", "DELETE"]
      - host_suffix: ".e2b.dev"
        schemes: ["https"]
        methods: ["GET", "POST", "DELETE"]
      - host_suffix: ".coinbase.com"
        schemes: ["https"]
        methods: ["GET", "POST"]
      - host_suffix: ".stripe.com"
        schemes: ["https"]
        methods: ["GET", "POST"]
      - host_suffix: ".moonpay.com"
        schemes: ["https"]
        methods: ["GET", "POST"]

# -- Postgres egress target (per-Darwin NetworkPolicy peer) ----------------
# When set, per-Darwin NetworkPolicies permit egress from the
# orchestrator pod to this Postgres deployment for shared state writes
# (audit chain, billing, lineage). Leave empty for SQLite mode.
postgresEgress:
  namespace: ""
  podLabelKey: "app.kubernetes.io/name"
  podLabelValue: "postgres"
  port: 5432
